name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug + unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The same JDK the project is verified against locally.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # android-actions/setup-android is deliberately NOT used here: it runs
      # `sdkmanager tools`, and the legacy `tools` package no longer exists in
      # current cmdline-tools, so the action fails before the build starts.
      # The ubuntu runner image already ships the Android SDK with its licences
      # accepted, so we only top up what is genuinely missing.
      - name: Ensure the Android SDK has what compileSdk 35 needs
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          if [ -z "${SDKMANAGER}" ]; then
            echo "No sdkmanager found; relying on the preinstalled SDK."
          else
            yes | "${SDKMANAGER}" --licenses > /dev/null 2>&1 || true
            if [ ! -d "${ANDROID_HOME}/platforms/android-35" ]; then
              echo "platforms;android-35 is missing - installing it."
              "${SDKMANAGER}" "platforms;android-35" > /dev/null 2>&1 || true
            fi
          fi
          echo "Installed platforms:"
          ls "${ANDROID_HOME}/platforms" 2>/dev/null || echo "  (none listed)"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make the wrapper executable
        run: chmod +x gradlew

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Run the unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
